<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신경망 연구소 별관 — 잇기와 솎아 내기 · 복권 가설</title>
<meta name="description" content="신경망을 이어 붙이면 생기는 일, 가지치기, 복권 가설(Lottery Ticket Hypothesis)을 3D와 실제 작은 실험으로">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1e; --panel:#111a30; --panel2:#18233f; --line:#27345a;
  --text:#e9edf9; --muted:#9aa7c7;
  --pink:#ff8fc7; --blue:#6fb1ff; --yellow:#ffd76a; --green:#7fe0a8; --purple:#b79cff;
  --acc:var(--blue); --grp:var(--blue);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.65;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:9px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.brand small{font-size:12px;font-weight:700;color:var(--yellow);margin-bottom:2px}
.brand small a{color:inherit;text-decoration:none}
.brand h1{font-size:21px;margin:0;font-weight:900;letter-spacing:-.02em}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button,nav a{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px;color:var(--muted);white-space:nowrap;text-decoration:none}
nav button:hover,nav a:hover{color:var(--text);border-color:var(--muted)}
nav button[aria-pressed="true"]{background:var(--c,var(--blue));border-color:var(--c,var(--blue));color:#0a0f1e;font-weight:700}
nav a{border-style:dashed}
nav button:focus-visible,nav a:focus-visible,.btn:focus-visible,.card:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}
#stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#17224a 0%,#0a0f1e 62%)}
#stage canvas.gl{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas.gl:active{cursor:grabbing}
#stage canvas.flat{display:block;width:100%;height:auto}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-size:12.5px;color:var(--text);text-shadow:0 1px 3px #000,0 0 8px #0a0f1e;will-change:transform}
.lb.title{font-size:14.5px;font-weight:700;padding:3px 13px;border-radius:999px;color:#0a0f1e;background:var(--c);text-shadow:none}
.lb.stage{font-size:13.5px;font-weight:700;color:var(--yellow)}
.lb.num{font-size:12.5px;font-weight:500;background:#0a0f1ecc;border:1px solid var(--line);border-radius:6px;padding:0 6px;text-shadow:none}
.lb.big{font-size:14.5px;font-weight:700;background:#0a0f1ee6;border:1px solid var(--c,var(--line));border-radius:8px;padding:1px 8px;text-shadow:none}
.lb.huge{font-size:24px;font-weight:900}
.lb.note{color:var(--muted)}
.lb.wrap{white-space:normal;text-align:center;width:max-content;max-width:150px;line-height:1.35}
.lb.say{background:#fff;color:#141a2e;text-shadow:none;font-size:13px;font-weight:500;line-height:1.45;padding:6px 11px;border-radius:12px;white-space:normal;width:max-content;max-width:240px;box-shadow:0 4px 14px #0008}
.lb.say::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:#fff;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.lb.say b{color:#b0307a}
#hint{position:absolute;left:14px;bottom:12px;font-size:12px;color:var(--muted);background:#0a0f1ecc;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:18px 18px 26px}
aside section{display:none}
aside section.on{display:block}
aside h2{font-size:21px;font-weight:900;letter-spacing:-.02em;margin:0 0 8px;color:var(--acc);line-height:1.3}
aside h3{font-size:13px;margin:18px 0 8px;color:var(--muted);font-weight:700;letter-spacing:.04em}
aside p{margin:0 0 10px}
aside a{color:var(--acc)}
.grp{font-size:12.5px;font-weight:700;color:var(--grp)}
.en{color:var(--muted);font-size:13px;margin:-4px 0 8px}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted);margin:0 4px 6px 0}
.three{background:var(--panel2);border-left:3px solid var(--acc);border-radius:0 10px 10px 0;padding:10px 12px;margin:10px 0 4px}
.three p{margin:0 0 4px}.three p:last-child{margin:0}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.kv div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.kv span{display:block;font-size:11.5px;color:var(--muted)}
.kv b{font-size:15px;font-weight:700}
.row{display:grid;grid-template-columns:108px 1fr 52px;align-items:center;gap:8px;margin:5px 0}
.row label{font-size:13px;color:var(--muted);line-height:1.3}
.row output{font-size:13px;font-weight:500;text-align:right}
.row.sel{grid-template-columns:108px 1fr}
input[type=range]{width:100%;accent-color:var(--acc);height:22px}
select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13.5px;text-decoration:none;color:var(--text)!important;display:inline-block}
.btn:hover{border-color:var(--acc)}
.more{display:grid;gap:6px}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.sumbox{background:#0a0f1e;border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.sumbox span{color:var(--muted);font-size:12.5px}
.cards{display:grid;gap:8px;margin-top:6px}
.card{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer}
.card:hover{border-color:var(--c)}
.card i{font-style:normal;font-weight:900;font-size:16px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0a0f1e}
.card b{display:block;font-size:14.5px}.card span{font-size:12.5px;color:var(--muted)}
.talk{display:grid;gap:8px;margin:12px 0 4px}
.talk div{display:grid;grid-template-columns:46px 1fr;gap:10px;align-items:start}
.talk img,.crew img{width:46px;height:46px;border-radius:50%;background:#22305a;border:2px solid var(--line);object-fit:cover}
.talk p{margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:7px 11px;font-size:14px}
.talk p b.nm{display:block;font-size:12px;color:var(--acc)}
.crew{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 10px}
.crew div{display:grid;grid-template-columns:46px 1fr;gap:8px;align-items:center;font-size:12px;color:var(--muted);line-height:1.35}
.crew b{display:block;color:var(--text);font-size:13px}
.eqbox{background:#0a0f1e;border:1px solid var(--line);border-radius:10px;margin:12px 0 4px;padding:0}
.eqbox summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:700;color:var(--acc)}
.eqbox .eqs{padding:0 14px 10px}
.eqbox code{display:block;font-family:"Noto Sans KR",sans-serif;font-size:14.5px;font-weight:500;color:var(--text);margin:2px 0;white-space:normal}
.eqbox p{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.why{font-size:13.5px;background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:6px 0 4px}
.quiz{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px}
.quiz b{display:block;font-size:14px;margin-bottom:6px}
.quiz button{display:block;width:100%;text-align:left;background:#0a0f1e;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:4px 0;cursor:pointer;font-size:13.5px}
.quiz button:hover{border-color:var(--acc)}
.quiz button.ok{border-color:var(--green);background:#123526}.quiz button.no{border-color:#ff7a7a;background:#3a1720}
.quiz p{font-size:13px;margin:6px 0 0;color:var(--muted)}
.refs{font-size:12px;color:var(--muted);padding-left:18px;margin:0}
.refs li{margin-bottom:4px}
.nextbtn{display:block;text-align:center;margin-top:14px;padding:10px;border-radius:10px;background:var(--acc);color:#0a0f1e!important;font-weight:700;text-decoration:none}
#pbar{display:none;position:fixed;top:10px;right:12px;z-index:20;gap:6px;align-items:center;background:#0a0f1ee6;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px;font-size:13.5px}
#pbar button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;cursor:pointer}
body.present header,body.present aside{display:none}
body.present main{grid-template-columns:1fr}
body.present #pbar{display:flex}
body.present #stage{height:100vh}
.foot{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.foot p{margin:0 0 4px}
@media (max-width:860px){
  body{overflow:auto;height:auto}
  main{display:block}
  #stage{height:56vh;min-height:330px}
  aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .brand h1{font-size:19px}
  .lb{font-size:10.5px}
  .lb.title{font-size:12px;padding:2px 9px}
  .lb.big{font-size:12px;padding:0 5px}
  .lb.num{font-size:10.5px;padding:0 4px}
  .lb.say{font-size:11px;max-width:150px}
  .lb.stage,.lb.wl{display:none!important}
  header{padding:8px 12px}
  nav{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  body.present{overflow:hidden;height:100%}
}
.tbl{overflow-x:auto;margin-top:6px}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.45}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:left}
.tbl thead th{background:var(--panel2);color:var(--acc)}
.tbl tbody th{color:var(--muted);font-weight:500;white-space:nowrap}
</style>
</head>

  const M = net.W.map(w => new Uint8Array(w.length)), K = Math.round(all.length * keep); for (let i = 0; i < K; i++) M[all[i][1]][all[i][2]] = 1; return M; }

  { k: 'gan', name: '만들고 가려내기 (GAN)', blocks: [['무작위 씨앗', 0x9aa7c7], ['생성자', 0xff9f6b], ['판별자', 0xb79cff], ['진짜? 가짜?', 0x9aa7c7]], loop: true,
    how: '생성자가 만든 가짜를 판별자가 가려냅니다. 판별자의 판정이 거꾸로 생성자를 고치는 신호가 됩니다(26층).', train: '두 신경망이 번갈아 학습합니다. 한쪽만 너무 강해지면 학습이 무너질 수 있습니다.' },
  { k: 'dbn', name: '차례로 쌓기 (DBN)', blocks: [['그림', 0x9aa7c7], ['RBM 1', 0x6fb1ff], ['RBM 2', 0x6fb1ff], ['RBM 3', 0x6fb1ff]], loop: false,

const QUIZ = [['신경망 두 개를 이을 때 가장 흔한 방식은?', ['앞 신경망의 출력을 뒤 신경망의 입력으로 넣는다', '두 신경망의 가중치를 더한다', '두 신경망을 따로 학습만 한다'], 0, '그래서 이은 전체를 한 신경망처럼 한꺼번에 학습하기도 합니다.'],

const kv = id => '<div class="kv" id="' + id + '"></div>';
const sel = (id, lab, opts) => '<div class="row sel"><label for="' + id + '">' + lab + '</label><select id="' + id + '">' + opts.map((o, i) => '<option value="' + i + '">' + o + '</option>').join('') + '</select></div>';
const rng = (id, lab, mn, mx, step) => '<div class="row"><label for="' + id + '">' + lab + '</label><input type="range" id="' + id + '" min="' + mn + '" max="' + mx + '" step="' + step + '"><output id="o_' + id + '"></output></div>';
const r0 = RUNS[0];
